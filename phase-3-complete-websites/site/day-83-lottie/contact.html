<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Start a creative project with Lottie Bennett." />
    <meta name="theme-color" content="#2b1619" />
    <title>Contact Lottie — Start a Project</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2edc7'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23ff9ee4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="components.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body class="inner-page" data-page="contact">
    <lottie-header></lottie-header>
    <main class="page-main">
      <section class="page-hero contact-page-hero">
        <p class="page-kicker">available for selected projects</p>
        <h1>say<br />hello</h1>
        <div class="contact-burst" aria-hidden="true">let’s talk</div>
      </section>
      <section class="contact contact-page-form">
        <div class="contact-intro reveal"><h2>Brand Identity,<br />Campaigns &amp; Digital<br />Experiences for<br />Fashion, Beauty &amp;<br />Lifestyle Brands</h2><p>Projects start at $2500</p><a href="mailto:hello@lottiebennet.com">hello@lottiebennet.com</a></div>
        <form class="contact-form reveal" data-mailto="hello@lottiebennet.com" novalidate>
          <h2>Tell Me What<br />You're Working On.</h2><p>Currently booking new creative projects.</p>
          <div class="form-grid">
            <label>Name<input type="text" name="name" placeholder="Paula Roger" required /></label>
            <label>Email<input type="email" name="email" placeholder="paula@example.com" required /></label>
            <label>Brand / Company<input type="text" name="company" placeholder="Your brand" /></label>
            <label>Budget<input type="text" name="budget" placeholder="$2,500–$10,000" /></label>
            <label class="form-wide">Project details<textarea name="project" placeholder="Tell me about the idea, timing and what you need." required></textarea></label>
          </div>
          <button type="submit">Start a Project With Me</button><span class="form-status" role="status" aria-live="polite"></span>
        </form>
      </section>
      <section class="contact-links page-section"><a href="mailto:hello@lottiebennet.com">Email</a><a href="https://instagram.com/" target="_blank" rel="noreferrer">Instagram</a><a href="https://linkedin.com/" target="_blank" rel="noreferrer">LinkedIn</a></section>
    </main>
    <lottie-footer></lottie-footer>
  </body>
</html>
